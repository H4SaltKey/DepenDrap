<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <title>DepenDrap Online - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="icon" href="assets/System/favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/ui/responsiveScale.js"></script>
  
  <!-- Firebase Configuration -->
  <script>
    window.FIREBASE_CONFIG = {
      apiKey: "AIzaSyDNe58gGvJ3-09brUHkoorkQalrS8jkPAw",
      authDomain: "dependrap-c30b4.firebaseapp.com",
      databaseURL: "https://dependrap-c30b4-default-rtdb.firebaseio.com",
      projectId: "dependrap-c30b4",
      storageBucket: "dependrap-c30b4.firebasestorage.app",
      messagingSenderId: "536531285865",
      appId: "1:536531285865:web:0d53a2c4fd8fae7ff32ff8"
    };
  </script>

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: radial-gradient(circle at center, #1a172c 0%, #08060f 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      margin: 0;
    }

    .login-container {
      background: rgba(20, 18, 32, 0.9);
      border: 1px solid #c7b377;
      border-radius: 8px;
      padding: 40px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8), inset 0 0 10px rgba(199,179,119,0.2);
      text-align: center;
      color: #e0d0a0;
    }

    .login-container h1 {
      margin-top: 0;
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 4px;
      border-bottom: 1px solid rgba(199,179,119,0.3);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    .login-subtitle {
      font-size: 12px;
      color: #888;
      margin-bottom: 24px;
      letter-spacing: 1px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      margin-bottom: 5px;
      color: #b0a070;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

	    .input-group input {
	      width: 100%;
	      padding: 12px;
	      background: #fff;
	      border: 1px solid #5a4b27;
	      color: #111;
	      border-radius: 4px;
	      box-sizing: border-box;
	      font-size: 16px;
	      transition: border-color 0.2s, box-shadow 0.2s;
	    }

	    .input-group input:-webkit-autofill,
	    .input-group input:-webkit-autofill:hover,
	    .input-group input:-webkit-autofill:focus {
	      -webkit-text-fill-color: #111;
	      box-shadow: 0 0 0 1000px #fff inset;
	      caret-color: #111;
	    }

	    .password-field {
	      position: relative;
	    }

	    .password-field input {
	      padding-right: 44px;
	    }

	    .password-toggle {
	      position: absolute;
	      top: 50%;
	      right: 8px;
	      width: 32px;
	      height: 32px;
	      transform: translateY(-50%);
	      display: inline-flex;
	      align-items: center;
	      justify-content: center;
	      border: none;
	      border-radius: 4px;
	      background: transparent;
	      color: #333;
	      cursor: pointer;
	    }

	    .password-toggle:hover,
	    .password-toggle:focus-visible {
	      background: rgba(0,0,0,0.08);
	      outline: none;
	    }

	    .password-toggle svg {
	      width: 20px;
	      height: 20px;
	      stroke: currentColor;
	      stroke-width: 2;
	      fill: none;
	      stroke-linecap: round;
	      stroke-linejoin: round;
	    }

    .input-group input:focus {
      outline: none;
      border-color: #c7b377;
      box-shadow: 0 0 5px rgba(199,179,119,0.4);
    }

    .input-group input::placeholder {
      color: #666;
    }

    .error-msg {
      color: #ff6b6b;
      font-size: 13px;
      min-height: 20px;
      margin-bottom: 15px;
    }

    .success-msg {
      color: #70c070;
      font-size: 13px;
      min-height: 20px;
      margin-bottom: 15px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .lorBtn {
      flex: 1;
      padding: 14px;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      justify-content: center;
      cursor: pointer;
      border-radius: 4px;
      background: linear-gradient(to bottom, #c7b377, #a88e4a);
      color: #1a172c;
      border: none;
      transition: all 0.2s;
    }

    .lorBtn:hover {
      filter: brightness(1.1);
    }

    .lorBtn:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .lorBtn.secondary {
      background: rgba(199,179,119,0.15);
      border: 1px solid rgba(199,179,119,0.5);
      color: #e0d0a0;
    }

    .lorBtn.secondary:hover {
      background: rgba(199,179,119,0.3);
    }

    .mode-toggle {
      text-align: center;
      margin-top: 15px;
      font-size: 12px;
      color: #888;
    }

    .mode-toggle button {
      background: none;
      border: none;
      color: #c7b377;
      cursor: pointer;
      text-decoration: underline;
      font-size: 12px;
    }

    .mode-toggle button:hover {
      color: #e0d0a0;
    }

    /* 開発者パスワードモーダル */
    .modalOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
      box-sizing: border-box;
    }

    .modalOverlay.hidden {
      display: none;
    }

    .modalBox {
      background: rgba(20,18,32,0.98);
      border: 1px solid #c7b377;
      border-radius: 10px;
      padding: 22px;
      width: min(100%, 380px);
      max-width: 380px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.7);
    }

    .modalTitle {
      margin: 0 0 14px 0;
      font-size: 18px;
      letter-spacing: 1px;
      color: #e0d0a0;
    }

    .modalBody {
      display: grid;
      gap: 12px;
    }

    .modalBody p {
      margin: 0;
      color: #d9c88d;
      font-size: 14px;
      line-height: 1.5;
    }

    .modalBody input {
      width: 100%;
      padding: 12px;
      border: 1px solid #5a4b27;
      border-radius: 6px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 15px;
      box-sizing: border-box;
    }

    .modalActions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .modalActions button {
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    .modalActions .cancelBtn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      color: #f4f1d6;
    }

    .modalActions .confirmBtn {
      background: #c7b377;
      border: none;
      color: #1a172c;
      font-weight: bold;
    }

    .modalError {
      color: #ff6b6b;
      font-size: 13px;
      min-height: 18px;
    }
  </style>
</head>
<body>

<div class="login-container">
  <h1>DepenDrap</h1>
  <p class="login-subtitle" id="modeTitle">LOGIN</p>

  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg"></div>

  <div class="input-group">
    <label for="nickname">Nickname</label>
    <input type="text" id="nickname" name="username" autocomplete="username" spellcheck="false"
           placeholder="ニックネームを入力" maxlength="20">
  </div>

	  <div class="input-group">
	    <label for="password">Password</label>
	    <div class="password-field">
	      <input type="password" id="password" name="password" autocomplete="current-password" spellcheck="false"
	             placeholder="パスワードを入力" maxlength="20">
	      <button type="button" class="password-toggle" id="passwordToggle" aria-label="パスワードを表示" aria-pressed="false">
	        <svg viewBox="0 0 24 24" aria-hidden="true">
	          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path>
	          <circle cx="12" cy="12" r="3"></circle>
	        </svg>
	      </button>
	    </div>
	  </div>

  <div class="button-group">
    <button class="lorBtn" id="submitBtn">LOGIN</button>
    <button class="lorBtn secondary" id="toggleBtn">REGISTER</button>
  </div>

  <div class="mode-toggle">
    <p id="toggleText">アカウントをお持ちでない場合は「REGISTER」をクリック</p>
  </div>
</div>

<div id="devPassModal" class="modalOverlay hidden">
  <div class="modalBox">
    <div class="modalTitle">開発者モード</div>
    <div class="modalBody">
      <p>開発者モードのパスワードを入力してください。</p>
      <input type="password" id="devPasswordInput" autocomplete="new-password" data-lpignore="true" data-1p-ignore="true" spellcheck="false" placeholder="パスワードを入力">
      <div class="modalError" id="devPassError"></div>
    </div>
    <div class="modalActions">
      <button type="button" class="cancelBtn" id="devPassCancel">キャンセル</button>
      <button type="button" class="confirmBtn" id="devPassConfirm">開発者モードへ</button>
    </div>
  </div>
</div>

<!-- Firebase SDK (Compat version) -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

<!-- Firebase Client -->
<script src="js/network/firebase-client.js?v=10"></script>
<script src="js/ui/passwordSaveGuard.js"></script>

<script>
  const firebaseConfig = window.FIREBASE_CONFIG;
  let db = null;
  let isLoginMode = true;

  // UI 要素
  const nicknameInput = document.getElementById("nickname");
	  const passwordInput = document.getElementById("password");
	  const passwordToggle = document.getElementById("passwordToggle");
  const submitBtn = document.getElementById("submitBtn");
  const toggleBtn = document.getElementById("toggleBtn");
  const errorMsg = document.getElementById("errorMsg");
  const successMsg = document.getElementById("successMsg");
  const modeTitle = document.getElementById("modeTitle");
  const toggleText = document.getElementById("toggleText");

  // 既にログイン済みなら index へ
  const saved = localStorage.getItem("username");
  if (saved && localStorage.getItem("isOnline") === "true") {
    window.location.href = "index.html";
  }

  /**
   * Firebase を初期化
   */
	  async function initializeFirebase() {
	    if (db) return true;
	    console.log("[Login] Firebase 初期化中...");
	    
	    const success = await firebaseClient.initialize(firebaseConfig);
	    
	    if (success) {
	      db = firebaseClient.db;
	      console.log("[Login] ✅ Firebase 初期化成功");
	      console.log("[Login] Project ID:", firebaseConfig.projectId);
	      return true;
	    } else {
	      console.error("[Login] ❌ Firebase 初期化失敗");
	    }
	    return false;
	  }

	  async function ensureLoginBackendReady() {
	    if (db) return true;
	    const ok = await initializeFirebase();
	    if (!ok) {
	      console.warn("[Login] Firebase 初期化に失敗したため、ローカルアカウントで続行します。");
	    }
	    return ok;
	  }

  /**
   * メッセージをクリア
   */
  function clearMessages() {
    errorMsg.textContent = "";
    successMsg.textContent = "";
  }

  /**
   * モードを切り替え
   */
  function toggleMode() {
    isLoginMode = !isLoginMode;
    clearMessages();
    
    if (isLoginMode) {
      modeTitle.textContent = "LOGIN";
      submitBtn.textContent = "LOGIN";
      toggleBtn.textContent = "REGISTER";
      toggleText.textContent = "アカウントをお持ちでない場合は「REGISTER」をクリック";
      passwordInput.placeholder = "パスワードを入力";
    } else {
      modeTitle.textContent = "REGISTER";
      submitBtn.textContent = "CREATE ACCOUNT";
      toggleBtn.textContent = "LOGIN";
      toggleText.textContent = "既にアカウントをお持ちの場合は「LOGIN」をクリック";
      passwordInput.placeholder = "新しいパスワードを入力";
    }
  }

  /**
   * ログイン処理
   */
  async function doLogin() {
    clearMessages();
    const nickname = nicknameInput.value.trim();
    const password = passwordInput.value.trim();

    // バリデーション
    if (!nickname) {
      errorMsg.textContent = "ニックネームを入力してください。";
      return;
    }

    if (!password) {
      errorMsg.textContent = "パスワードを入力してください。";
      return;
    }

    if (nickname.length < 2) {
      errorMsg.textContent = "ニックネームは2文字以上で入力してください。";
      return;
    }

    if (password.length < 4) {
      errorMsg.textContent = "パスワードは4文字以上で入力してください。";
      return;
    }

    // Firebase が初期化されていない場合
    if (!db) {
      console.warn("[Login] Firebase が初期化されていません。ローカルストレージを使用します。");
      
      const accountsJson = localStorage.getItem("accounts");
      const accounts = accountsJson ? JSON.parse(accountsJson) : {};
      
	      if (!accounts[nickname]) {
	        errorMsg.textContent = `入力されたアカウント名「${nickname}」は存在しません。アカウント名を確認するか、REGISTERで作成してください。`;
	        return;
	      }

	      const accountData = accounts[nickname];
	      
	      if (accountData.password !== password) {
	        errorMsg.textContent = `アカウント名「${nickname}」は存在しますが、パスワードが異なります。`;
	        return;
	      }

	      accountData.lastLogin = Date.now();
	      accounts[nickname] = accountData;
	      localStorage.setItem("accounts", JSON.stringify(accounts));

	      // ログイン成功
	      localStorage.setItem("username", nickname);
	      localStorage.setItem("isOnline", "true");
	      localStorage.setItem("accountId", accountData.id);
	      firebaseClient.username = nickname;
      
      console.log("[Login] ✅ ログイン成功（ローカル）:", nickname);
      window.location.href = "index.html";
      return;
    }

    // Firebase でログイン
    try {
      const accountRef = db.ref(`accounts/${nickname}`);
      const snapshot = await accountRef.once('value');

	      if (!snapshot.exists()) {
	        errorMsg.textContent = `入力されたアカウント名「${nickname}」は存在しません。アカウント名を確認するか、REGISTERで作成してください。`;
	        return;
	      }

      const accountData = snapshot.val();
      
	      if (accountData.password !== password) {
	        errorMsg.textContent = `アカウント名「${nickname}」は存在しますが、パスワードが異なります。`;
	        return;
	      }

	      // ログイン成功
	      await accountRef.update({ lastLogin: firebase.database.ServerValue.TIMESTAMP });
	      localStorage.setItem("username", nickname);
	      localStorage.setItem("isOnline", "true");
	      localStorage.setItem("accountId", accountData.id);
	      firebaseClient.username = nickname;
      
      console.log("[Login] ✅ ログイン成功:", nickname);
      window.location.href = "index.html";
    } catch (error) {
      console.error("[Login] ログインエラー:", error.message);
      errorMsg.textContent = "ログイン処理中にエラーが発生しました。";
    }
  }

  /**
   * アカウント作成処理
   */
  async function doRegister() {
    clearMessages();
    const nickname = nicknameInput.value.trim();
    const password = passwordInput.value.trim();

    // バリデーション
    if (!nickname) {
      errorMsg.textContent = "ニックネームを入力してください。";
      return;
    }

    if (!password) {
      errorMsg.textContent = "パスワードを入力してください。";
      return;
    }

    if (nickname.length < 2) {
      errorMsg.textContent = "ニックネームは2文字以上で入力してください。";
      return;
    }

    if (password.length < 4) {
      errorMsg.textContent = "パスワードは4文字以上で入力してください。";
      return;
    }

    // Firebase が初期化されていない場合
    if (!db) {
      console.warn("[Login] Firebase が初期化されていません。ローカルストレージを使用します。");
      
      const accountsJson = localStorage.getItem("accounts");
      const accounts = accountsJson ? JSON.parse(accountsJson) : {};
      
	      if (accounts[nickname]) {
	        errorMsg.textContent = `アカウント名「${nickname}」は既に存在します。ログインするか、別のアカウント名で作成してください。`;
	        return;
	      }

      // 新規アカウントを作成
      const accountId = Math.random().toString(36).substr(2, 9);
      const accountData = {
        id: accountId,
        nickname: nickname,
        password: password,
        createdAt: Date.now(),
        lastLogin: Date.now()
      };

      accounts[nickname] = accountData;
      localStorage.setItem("accounts", JSON.stringify(accounts));

	      // ログイン状態に設定
	      localStorage.setItem("username", nickname);
	      localStorage.setItem("isOnline", "true");
	      localStorage.setItem("accountId", accountId);
	      firebaseClient.username = nickname;

      successMsg.textContent = "アカウントを作成しました。ゲームを開始します...";
      console.log("[Login] ✅ アカウント作成成功（ローカル）:", nickname);
      
      setTimeout(() => {
        window.location.href = "index.html";
      }, 1000);
      return;
    }

    // Firebase でアカウント作成
    try {
      const accountRef = db.ref(`accounts/${nickname}`);
      const snapshot = await accountRef.once('value');

	      if (snapshot.exists()) {
	        errorMsg.textContent = `アカウント名「${nickname}」は既に存在します。ログインするか、別のアカウント名で作成してください。`;
	        return;
	      }

      // 新規アカウントを作成
      const accountId = Math.random().toString(36).substr(2, 9);
      const accountData = {
        id: accountId,
        nickname: nickname,
        password: password,
        createdAt: firebase.database.ServerValue.TIMESTAMP,
        lastLogin: firebase.database.ServerValue.TIMESTAMP
      };

      await accountRef.set(accountData);

	      // ログイン状態に設定
	      localStorage.setItem("username", nickname);
	      localStorage.setItem("isOnline", "true");
	      localStorage.setItem("accountId", accountId);
	      firebaseClient.username = nickname;

      successMsg.textContent = "アカウントを作成しました。ゲームを開始します...";
      console.log("[Login] ✅ アカウント作成成功:", nickname);
      
      setTimeout(() => {
        window.location.href = "index.html";
      }, 1000);
    } catch (error) {
      console.error("[Login] アカウント作成エラー:", error.message);
      errorMsg.textContent = "アカウント作成中にエラーが発生しました。";
    }
  }

  /**
   * フォーム送信
   */
	  async function handleSubmit() {
	    if (submitBtn.disabled) return;
	    submitBtn.disabled = true;
	    toggleBtn.disabled = true;
	    clearMessages();
	    successMsg.textContent = "接続を確認しています...";
	    try {
	      await ensureLoginBackendReady();
	      successMsg.textContent = "";
	      if (isLoginMode) {
	        await doLogin();
	      } else {
	        await doRegister();
	      }
	    } finally {
	      submitBtn.disabled = false;
	      toggleBtn.disabled = false;
	    }
	  }

  // イベントリスナー
	  submitBtn.addEventListener("click", handleSubmit);
	  toggleBtn.addEventListener("click", toggleMode);
	  passwordToggle.addEventListener("click", () => {
	    const shouldShow = passwordInput.type === "password";
	    passwordInput.type = shouldShow ? "text" : "password";
	    passwordToggle.setAttribute("aria-label", shouldShow ? "パスワードを非表示" : "パスワードを表示");
	    passwordToggle.setAttribute("aria-pressed", shouldShow ? "true" : "false");
	    passwordToggle.innerHTML = shouldShow
	      ? `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"></path><path d="M10.6 10.6A2 2 0 0 0 12 14a2 2 0 0 0 1.4-.6"></path><path d="M9.9 4.2A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8a18.5 18.5 0 0 1-3.1 4.4"></path><path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 8 10 8a10.9 10.9 0 0 0 5-1.2"></path></svg>`
	      : `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
	    passwordInput.focus();
	  });
  
  nicknameInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") handleSubmit();
  });
  
  passwordInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") handleSubmit();
  });

  // 初期化
  window.addEventListener("load", () => {
    // ページ読み込み時は Firebase を初期化しない
    // ログイン/アカウント作成時のみ初期化する
    console.log("[Login] ページ読み込み完了");
  });
</script>

</body>
</html>
